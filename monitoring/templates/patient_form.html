<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    text-align: center;
    margin: 50px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    width: 50%;
    margin: auto;
}

input, button {
    margin: 10px;
    padding: 8px;
    width: 80%;
}

button {
    background-color: blue;
    color: white;
    border: none;
    cursor: pointer;
    padding: 10px;
}

button:hover {
    background-color: darkblue;
}
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("healthForm").addEventListener("submit", function(event) {
                event.preventDefault(); // Prevent page refresh
                
                let formData = new FormData(this);
    
                fetch("/result/", {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    let resultDiv = document.getElementById("result");
                    resultDiv.innerHTML = "<h3>Health Condition: " + data.condition + "</h3>";
    
                    if (data.condition === "Critical") {
                        let audio = new Audio('/static/alert.mp3');
                        audio.play();
                        resultDiv.style.color = "red";
                    } else if (data.condition === "Normal") {
                        resultDiv.style.color = "green";
                    } else {
                        resultDiv.style.color = "orange";
                    }
                })
                .catch(error => console.error("Error:", error));
            });
        });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Monitoring</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        function checkHealth() {
            let formData = new FormData(document.getElementById("healthForm"));

            fetch("/result/", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                let resultDiv = document.getElementById("result");
                resultDiv.innerHTML = "<h3>Health Condition: " + data.condition + "</h3>";

                if (data.condition === "Critical") {
                    let audio = new Audio('/static/alert.mp3');
                    audio.play();
                    resultDiv.style.color = "red";
                } else if (data.condition === "Normal") {
                    resultDiv.style.color = "green";
                } else {
                    resultDiv.style.color = "orange";
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Enter Patient Details</h2>
        <form id="healthForm">
            <label>Name:</label>
            <input type="text" name="name" required><br>

            <label>Age:</label>
            <input type="number" name="age" required><br>

            <label>Pulse Rate:</label>
            <input type="number" name="pulse_rate" required><br>

            <label>Heart Rate:</label>
            <input type="number" name="heart_rate" required><br>

            <label>Blood Pressure:</label>
            <input type="text" name="blood_pressure" placeholder="120/80" required><br>

            <button type="button" id="submit-button">Check Health</button>
        </form>
        <div id="result"></div>
    </div>
    <script>
        document.getElementById("submit-button").addEventListener("click", function() {
            document.getElementById("health-form").submit(); 
        });
        </script>
</body>
</html>
