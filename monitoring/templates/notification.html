<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Status Notification</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="container">
        <h2>Hello, {{ username }}!</h2>
        <p>Your health status based on the latest data:</p>

        <div id="health-status" class="alert">
            {{ health_status }}
        </div>

        <!-- Alert Sound (Only if the vitals are abnormal) -->
        <audio id="alertSound" src="{% static 'audio/alert.mp3' %}"></audio>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                let healthStatus = "{{ health_status }}";

                // Check if healthStatus contains any alert keywords
                if (healthStatus.includes("🚨") || healthStatus.includes("⚠️")) {
                    let audio = document.getElementById("alertSound");
                    audio.play().catch(error => console.log("Audio play failed: ", error));
                }
            });
        </script>

    </div>

</body>
</html>
