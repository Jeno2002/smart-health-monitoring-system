     <div class="container"><br><br><br><br>

        <h2>Smart Health Monitoring</h2>
        <label for="pulse_rate">Pulse Rate (bpm):</label><br>
        <input type="number" id="pulse_rate" placeholder="Enter pulse rate"><br>

        <input type="number" id="heart_rate" placeholder="Enter heart rate">
        
        <label for="blood_pressure_sys">Blood Pressure (Sys):</label>
        <input type="number" id="blood_pressure_sys" placeholder="Enter systolic pressure">
        
        <label for="blood_pressure_dia">Blood Pressure (Dia):</label>
        <input type="number" id="blood_pressure_dia" placeholder="Enter diastolic pressure">
        
        <label for="sugar_level">Sugar Level (mg/dL):</label>
        <input type="number" id="sugar_level" placeholder="Enter sugar level">
        
        <button onclick="checkHealthCondition()">Check Health</button>
      </div>

    <!-- Modal for Health Condition with Slider -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span><br>
            <h3>Health Condition</h3><br>
            <div class="slider-container">
                <div class="slider" id="alertSlider"></div>
            </div>
        </div>
    </div>

    <audio id="alertSound" src="{% static 'audio/alert.mp3' %}"></audio>

    <!-- External JS (If Needed) -->
    <script src="{% static 'js/script.js' %}"></script>

    <script>
        async function checkHealthCondition() {
            let pulse = parseInt(document.getElementById("pulse_rate").value);
            let heartRate = parseInt(document.getElementById("heart_rate").value);
            let bpSys = parseInt(document.getElementById("blood_pressure_sys").value);
            let bpDia = parseInt(document.getElementById("blood_pressure_dia").value);
            let sugarLevel = parseInt(document.getElementById("sugar_level").value);
            let alertSound = document.getElementById("alertSound");
            let modal = document.getElementById("resultModal");
            let slider = document.getElementById("alertSlider");

            try {
            const response = await fetch("http://127.0.0.1:8000/check_up_count/", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                },
            });
            if (response.status === 200) {
                    const data = await response.json();
                    countDisplay.textContent = `Current Count: ${data.count}`;
                } else {
                    console.error('Failed to fetch the count');
                }
          }
          catch (error) {
            console.error(error);
          }

            if (isNaN(pulse) || isNaN(heartRate) || isNaN(bpSys) || isNaN(bpDia) || isNaN(sugarLevel)) {
                alert("Please enter all values!");
                return;
            }

            let condition = "Good";
            let statusClass = "good";
            let isAbnormal = false;

            if (pulse < 60 || pulse > 100 || heartRate < 60 || heartRate > 100) {
                condition = "Medium";
                statusClass = "medium";
                isAbnormal = true;
            }

            if (bpSys < 90 || bpSys > 140 || bpDia < 60 || bpDia > 90 || sugarLevel < 70 || sugarLevel > 140) {
                condition = "Bad";
                statusClass = "bad";
                isAbnormal = true;
            }

            alert(`Your health condition is: ${condition}`);

            slider.innerHTML = `
        <h2 class="page-heading">Health Condition Details</h2>
        <div class="result_container">
          <div class="image-box">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjYWYcZwPHpPhmD6MvsV-U6eBcV0Y5YLdwTw&s" alt="Doctor Consultation" />
          </div>
          <div class="condition-box">
            <p><strong>Health Status:</strong> ${condition}</p>
            <p>${condition === "Good" ? "You're doing well! Keep it up." : (condition === "Medium" ? "Monitor your health closely." : "Consult a doctor immediately.")}</p>
            <p><strong>Doctor:</strong> Dr. John Doe</p>
            <p><strong>Contact:</strong> <a href="tel:6789754790">6789754790</a></p>
          </div>
        </div>
      `;

            modal.style.display = "flex";

            if (isAbnormal) {
                alertSound.play();
            }
        }

        function closeModal() {
            document.getElementById("resultModal").style.display = "none";
        }
    </script>
